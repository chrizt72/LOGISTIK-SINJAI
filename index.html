    <script>
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function MockViteWebSocket(url, protocols) {
          var target = new EventTarget();
          target.url = String(url || '');
          target.protocol = Array.isArray(protocols) ? (protocols[0] || 'vite-hmr') : String(protocols || 'vite-hmr');
          target.readyState = 1;
          target.OPEN = 1;
          target.CONNECTING = 0;
          target.CLOSING = 2;
          target.CLOSED = 3;
          target.bufferedAmount = 0;
          target.extensions = '';
          target.binaryType = 'blob';
          target.send = function () {};
          target.close = function () {};
          return target;
        }
        MockViteWebSocket.CONNECTING = 0;
        MockViteWebSocket.OPEN = 1;
        MockViteWebSocket.CLOSING = 2;
        MockViteWebSocket.CLOSED = 3;
        var WrappedWebSocket = function (url, protocols) {
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
            return MockViteWebSocket(url, protocols);
          }
          return protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
        };
        WrappedWebSocket.prototype = NativeWebSocket.prototype;
        WrappedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        WrappedWebSocket.OPEN = NativeWebSocket.OPEN;
        WrappedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        WrappedWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = WrappedWebSocket;
      })();
    </script>
